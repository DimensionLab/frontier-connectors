name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach proprietary simulation data or files from a licensed solver
        installation. A small synthetic or public sample that reproduces the problem is ideal.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got (full error text).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python and/or Rust version, GPU if relevant.

# Generated by DimensionLab's export tooling (uv workspace root for this repository).
[project]
name = "frontier-connectors-workspace"
version = "0.0.0"
description = "uv workspace root of frontier-connectors"
requires-python = ">=3.11,<3.14"
dependencies = ["frontier-connector-arrays", "frontier-connector-catalyst", "frontier-connector-cgns", "frontier-connector-code-saturne", "frontier-connector-ensight", "frontier-exporter-catalyst", "frontier-connector-geometry", "frontier-connector-meshio", "frontier-connector-nek5000", "frontier-connector-openfoam", "frontier-connectors-oss", "frontier-connector-palabos", "frontier-connector-pyfr", "frontier-connector-tabular", "frontier-connector-vtk", "frontier-connectors"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.13", "pyright>=1.1.400"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/connectors/arrays/", "packages/connectors/catalyst/", "packages/connectors/cgns/", "packages/connectors/code-saturne/", "packages/connectors/ensight/", "packages/connectors/exporter-catalyst/", "packages/connectors/geometry/", "packages/connectors/meshio/", "packages/connectors/nek5000/", "packages/connectors/openfoam/", "packages/connectors/oss/", "packages/connectors/palabos/", "packages/connectors/pyfr/", "packages/connectors/tabular/", "packages/connectors/vtk/", "packages/frontier-connectors/"]

[tool.uv.sources]
frontier-connector-arrays = { workspace = true }
frontier-connector-catalyst = { workspace = true }
frontier-connector-cgns = { workspace = true }
frontier-connector-code-saturne = { workspace = true }
frontier-connector-ensight = { workspace = true }
frontier-exporter-catalyst = { workspace = true }
frontier-connector-geometry = { workspace = true }
frontier-connector-meshio = { workspace = true }
frontier-connector-nek5000 = { workspace = true }
frontier-connector-openfoam = { workspace = true }
frontier-connectors-oss = { workspace = true }
frontier-connector-palabos = { workspace = true }
frontier-connector-pyfr = { workspace = true }
frontier-connector-tabular = { workspace = true }
frontier-connector-vtk = { workspace = true }
frontier-connectors = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.isort]
known-first-party = ["frontier", "frontier_agent", "frontier_connectors", "frontier_data", "frontier_deploy", "frontier_eval", "frontier_examples", "frontier_explain", "frontier_hub", "frontier_physicsnemo", "frontier_planner", "frontier_prep", "frontier_train"]

[tool.pytest.ini_options]
testpaths = ["packages/connectors/arrays/", "packages/connectors/catalyst/", "packages/connectors/cgns/", "packages/connectors/code-saturne/", "packages/connectors/ensight/", "packages/connectors/exporter-catalyst/", "packages/connectors/geometry/", "packages/connectors/meshio/", "packages/connectors/nek5000/", "packages/connectors/openfoam/", "packages/connectors/oss/", "packages/connectors/palabos/", "packages/connectors/pyfr/", "packages/connectors/tabular/", "packages/connectors/vtk/", "packages/frontier-connectors/"]
addopts = "-q --import-mode=importlib"

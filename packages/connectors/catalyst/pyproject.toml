# Generated by tools/sync_plugins.py from src/frontier_connector_catalyst/plugin.toml. Do not edit by hand:
# change the manifest and run `uv run python packages/frontier-connectors/tools/sync_plugins.py`.
[project]
name = "frontier-connector-catalyst"
version = "0.9.0"
description = "DimensionLab Frontier plugin: In-situ streams: Conduit Blueprint spool, relay files, ADIOS2"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "frontier-connectors>=0.9.0,<0.10",
]

[project.optional-dependencies]
adios2 = ["adios2>=2.10"]
hdf5 = ["h5py>=3.10"]
yaml = ["pyyaml>=6"]

[project.entry-points."frontier.plugins"]
catalyst = "frontier_connector_catalyst"

[project.entry-points."frontier.connectors"]
catalyst = "frontier_connector_catalyst.connector:CatalystConnector"

[project.entry-points."frontier.importers"]
catalyst = "frontier_connector_catalyst.importer:CatalystImporter"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
frontier-connectors = { workspace = true }

requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "frontier-connectors>=0.9.0,<0.10",
  "h5py>=3.10",
  "vtk>=9.3",
  "frontier-connector-ensight>=0.9.0",

# Generated by tools/sync_plugins.py from src/frontier_connector_arrays/plugin.toml. Do not edit by hand:
# change the manifest and run `uv run python packages/frontier-connectors/tools/sync_plugins.py`.
[project]
name = "frontier-connector-arrays"
version = "0.9.0"
description = "DimensionLab Frontier plugin: NetCDF 3/4, generic HDF5 and Zarr v2/v3"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "frontier-connectors>=0.9.0,<0.10",
  "h5py>=3.10",
  "scipy>=1.13",
  "zarr>=3.0",
]

[project.optional-dependencies]
xarray = ["xarray>=2024.1"]

[project.entry-points."frontier.plugins"]
arrays = "frontier_connector_arrays"

[project.entry-points."frontier.connectors"]
hdf5 = "frontier_connector_arrays.connector:Hdf5Connector"
netcdf = "frontier_connector_arrays.connector:NetcdfConnector"
zarr = "frontier_connector_arrays.connector:ZarrConnector"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
frontier-connectors = { workspace = true }

[project]
name = "frontier-connector-meshio"
version = "0.9.0"
description = "DimensionLab Frontier plugin: Exodus II, XDMF, Gmsh MSH, MED, SU2 and other meshio formats"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "frontier-connectors>=0.9.0,<0.10",
  "meshio>=5.3",
  "vtk>=9.3",
  "h5py>=3.10",
]

[project.entry-points."frontier.plugins"]
meshio = "frontier_connector_meshio"

[project.entry-points."frontier.connectors"]
exodus = "frontier_connector_meshio.connector:ExodusConnector"
gmsh = "frontier_connector_meshio.connector:GmshConnector"
med = "frontier_connector_meshio.connector:MedConnector"
meshio = "frontier_connector_meshio.connector:MeshioConnector"
su2 = "frontier_connector_meshio.connector:Su2Connector"
xdmf = "frontier_connector_meshio.connector:XdmfConnector"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
frontier-connectors = { workspace = true }
